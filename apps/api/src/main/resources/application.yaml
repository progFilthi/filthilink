server:
  port: ${PORT:8080}

spring:
  application:
    name: FilthiLink




#  datasource:
#    url: jdbc:postgres://localhost:5432/filthiLinkDb
#    username: filthi
#    password: filthi_pass
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  google:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
#  base-url: http://localhost:8080
  base-url: https://filthilink.store
  admin-emails: ${ADMIN_EMAILS:}
  refresh-token:
    expiry: 7
  jwt:
    secret: ${JWT_SECRET}
    expiry: 900000


dodo:
  payments:
    api-key: ${DODO_API_KEY}
    webhook-key: ${DODO_WEBHOOK_KEY}
    premium-monthly: ${PREMIUM_MONTHLY}
    premium-yearly: ${PREMIUM_YEARLY}
    environment: ${DODO_ENVIRONMENT}
#  sandbox or live